# ============================================================================
# Application de demonstration Spring Security
# ----------------------------------------------------------------------------
# Aucune base de donnees : les utilisateurs sont declares en memoire dans
# SecurityConfig. Le modele de rafraichissement est desactive pour eviter les
# redemarrages parasites pendant les tests manuels.
# ============================================================================

server.port=8080

spring.thymeleaf.cache=false

# Le journal des connexions remonte les succes et les echecs au niveau INFO
logging.level.org.springframework.security=INFO
logging.level.ma.fstg.security=INFO
